<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" width="1000" height="830" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#57606A"/>
    </marker>
    <marker id="a2r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#CF222E"/>
    </marker>
    <marker id="a2y" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#9A6700"/>
    </marker>
  </defs>

  <rect width="1000" height="830" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2328">一条指令的完整生命周期</text>

  <!-- 1 管理员 -->
  <rect x="300" y="66" width="400" height="66" rx="10" fill="#FFF1E5" stroke="#BC4C00" stroke-width="1.5"/>
  <text x="500" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#8A3600">① 管理员连接 TCP 9999</text>
  <text x="500" y="114" text-anchor="middle" font-size="12" fill="#BC4C00">输入权限等级（1~3）→ 输入指令，如 reboot</text>

  <!-- 2 主线程 -->
  <rect x="300" y="172" width="400" height="66" rx="10" fill="#DDF4FF" stroke="#0969DA" stroke-width="1.5"/>
  <text x="500" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#0A3069">② 主线程 epoll 收到指令并封包</text>
  <text x="500" y="220" text-anchor="middle" font-size="12" fill="#0969DA">MsgPacket { cmd, len, priority, data, sender_ip }</text>

  <path d="M500,132 L500,168" stroke="#57606A" stroke-width="1.8" fill="none" marker-end="url(#a2)"/>
  <text x="510" y="156" font-size="11" fill="#57606A">TCP 读事件</text>

  <!-- 分叉 -->
  <path d="M500,238 L500,276 L280,276 L280,296" stroke="#57606A" stroke-width="1.8" fill="none" marker-end="url(#a2r)"/>
  <path d="M500,238 L500,276 L720,276 L720,296" stroke="#57606A" stroke-width="1.8" fill="none" marker-end="url(#a2y)"/>

  <!-- 左链路标题 -->
  <text x="280" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#CF222E">③ 组播下发链路（实时）</text>
  <!-- 右链路标题 -->
  <text x="720" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#9A6700">④ 审计落库链路（异步）</text>

  <!-- 左列 -->
  <rect x="140" y="300" width="280" height="60" rx="9" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.4"/>
  <text x="280" y="326" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F5323">queue_push → 组播发送队列</text>
  <text x="280" y="345" text-anchor="middle" font-size="11.5" fill="#1A7F37">队列满则阻塞等待，不丢包</text>

  <rect x="140" y="398" width="280" height="60" rx="9" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.4"/>
  <text x="280" y="424" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F5323">子线程 1：queue_pop 取包</text>
  <text x="280" y="443" text-anchor="middle" font-size="11.5" fill="#1A7F37">无数据时阻塞在条件变量</text>

  <rect x="140" y="496" width="280" height="60" rx="9" fill="#FFEFF3" stroke="#CF222E" stroke-width="1.4"/>
  <text x="280" y="522" text-anchor="middle" font-size="12.5" font-weight="600" fill="#A40E26">sendto 组播 239.1.1.1:8888</text>
  <text x="280" y="541" text-anchor="middle" font-size="11.5" fill="#CF222E">仅发送 1 次，不逐台发送</text>

  <rect x="140" y="594" width="280" height="60" rx="9" fill="#FFEFF3" stroke="#CF222E" stroke-width="1.4"/>
  <text x="280" y="620" text-anchor="middle" font-size="12.5" font-weight="600" fill="#A40E26">交换机硬件复制数据包</text>
  <text x="280" y="639" text-anchor="middle" font-size="11.5" fill="#CF222E">N 台终端同时收到并执行</text>

  <!-- 右列 -->
  <rect x="580" y="300" width="280" height="60" rx="9" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.4"/>
  <text x="720" y="326" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F5323">db_push_record → 数据库队列</text>
  <text x="720" y="345" text-anchor="middle" font-size="11.5" fill="#1A7F37">与下发链路完全解耦</text>

  <rect x="580" y="398" width="280" height="60" rx="9" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.4"/>
  <text x="720" y="424" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F5323">子线程 2：queue_pop 取包</text>
  <text x="720" y="443" text-anchor="middle" font-size="11.5" fill="#1A7F37">sqlite3_prepare_v2 预编译一次</text>

  <rect x="580" y="496" width="280" height="60" rx="9" fill="#FFF8C5" stroke="#9A6700" stroke-width="1.4"/>
  <text x="720" y="522" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7D4E00">bind + step + reset 复用语句</text>
  <text x="720" y="541" text-anchor="middle" font-size="11.5" fill="#9A6700">避免 SQL 拼接与注入风险</text>

  <rect x="580" y="594" width="280" height="60" rx="9" fill="#FFF8C5" stroke="#9A6700" stroke-width="1.4"/>
  <text x="720" y="620" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7D4E00">commands.db 落库</text>
  <text x="720" y="639" text-anchor="middle" font-size="11.5" fill="#9A6700">指令类型 / 优先级 / 内容 / IP / 时间</text>

  <!-- 列内箭头 -->
  <path d="M280,360 L280,394" stroke="#57606A" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <path d="M280,458 L280,492" stroke="#57606A" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <path d="M280,556 L280,590" stroke="#57606A" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <path d="M720,360 L720,394" stroke="#57606A" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <path d="M720,458 L720,492" stroke="#57606A" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <path d="M720,556 L720,590" stroke="#57606A" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>

  <!-- 结论 -->
  <rect x="240" y="700" width="520" height="72" rx="12" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.4"/>
  <text x="500" y="728" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">实际耗时：毫秒级下发 · 秒级全网生效</text>
  <text x="500" y="752" text-anchor="middle" font-size="12" fill="#57606A">数据库写入变慢不会影响指令下发，两条链路互不阻塞</text>

  <path d="M280,654 L280,676 L500,676 L500,696" stroke="#57606A" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <path d="M720,654 L720,676 L500,676" stroke="#57606A" stroke-width="1.6" fill="none"/>
</svg>
